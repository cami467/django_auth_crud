<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django CRUD Application</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="{% url 'home' %}">Django App</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
                <a class="nav-link active" href="{% url 'home' %}">Home</a>
            </li>
            {% if user.is_authenticated %}
             <li class="nav-item">
                <a class="nav-link active" href="{% url 'tasks' %}">Tasks Pending</a>
            </li>
             <li class="nav-item">
                <a class="nav-link active" href="{% url 'tasks_completed' %}">Tasks Completed</a>
            </li>
             <li class="nav-item">
                <a class="nav-link active" href="{% url 'create_task' %}">Create Task</a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="{% url 'logout' %}">Logout</a>
            </li>
            {% else %}
            <li class="nav-item">
                <a class="nav-link active" href="{% url 'signup' %}">Signup</a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="{% url 'signin' %}">Signin</a>
            </li>
            {% endif %}
      </ul>
    </div>
  </div>
</nav>
    <main class="flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <small>&copy; {% now "Y" %} Camila Benitez</small>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
