{% extends 'base.html' %}

{% block content %}

<section class="container py-5 d-flex justify-content-center align-items-center">
    <div class="card shadow-lg border-0 rounded" style="max-width: 500px; width: 100%;">
        <div class="card-header bg-primary text-white text-center">
            <h2>Create Task</h2>
        </div>
        <div class="card-body">

            {% if error %}
                <div class="alert alert-danger text-center">
                    {{ error }}
                </div>
            {% endif %}

            <form action="{% url 'create_task' %}" method="POST" class="needs-validation" novalidate>
                {% csrf_token %}
                {{ form.as_p }}

                <div class="d-flex justify-content-center mt-4">
                    <button type="submit" class="btn btn-success btn-md px-4">
                        <i class="bi bi-save me-1"></i> Save Task
                    </button>
                </div>
            </form>

        </div>
    </div>
</section>

{% endblock %}
